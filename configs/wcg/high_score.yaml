paths:
  data_dir: data
  artifact_dir: artifacts

experiment:
  seed: 42
  cv_splits: 5

training:
  tune_models: true
  tune_model_trials: 30
  tune_blend_weights: true
  tune_blend_trials: 50

models:
  rf:
    n_estimators: 1400
    max_depth: 5
    min_samples_leaf: 3
    min_samples_split: 5
    criterion: entropy
  et:
    n_estimators: 800
    max_depth: 13
    min_samples_leaf: 8
    min_samples_split: 7
  cb:
    iterations: 2100
    learning_rate: 0.0213
    depth: 4
    l2_leaf_reg: 6.63
    loss_function: Logloss

blend:
  fixed_weights:
    rf_wcg: 0.22
    et_wcg: 0.29
    cb_wcg: 0.49

outputs:
  generate_submissions:
    rf: true
    et: true
    cb: true
    blend_equal: true
    blend_fixed: true
    blend_optuna: true
